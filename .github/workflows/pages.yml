# Deploy the site to GitHub Pages as a PLAIN STATIC SITE (no Jekyll).
# Jekyll must be bypassed: it converts content/*.md to .html (breaking the
# article engine's fetch of raw markdown) and chokes on {{embed:...}} tokens.
# This workflow also regenerates the Library TOC from content frontmatter,
# exactly like the Netlify build does.
#
# One-time setup: repo Settings → Pages → Source = "GitHub Actions".

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Generate Library TOC
        run: node scripts/build-toc.js

      - name: Generate SEO pages, sitemap, robots
        run: node scripts/build-seo.js

      - name: Generate Playground sample manifest
        run: node scripts/build-samples.js

      # Minify shipped JS + CSS in place before upload. Whitespace/syntax only —
      # identifier renaming stays OFF because the modules share top-level
      # globals (Quiz, WORKSHOPS, Spine…) across separate <script> files.
      # The repo itself stays readable; only the deployed artifact is minified.
      - name: Minify JS and CSS
        run: |
          npx --yes esbuild assets/js/*.js --minify-whitespace --minify-syntax --allow-overwrite --outdir=assets/js
          npx --yes esbuild assets/css/style.css --minify --allow-overwrite --outfile=assets/css/style.css

      # Publish only what the website serves. The Translator service (ai-api),
      # the retired Java engine, docs and build scripts stay in the repo only.
      - name: Collect the web-facing files
        run: |
          mkdir _site
          cp -r index.html favicon.ico .nojekyll assets content samples status insights admin \
                library dictionary glossary workshop sitemap.xml robots.txt _site/
          if [ -f CNAME ]; then cp CNAME _site/; fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
